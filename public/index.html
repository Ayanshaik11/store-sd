<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0f19"
  >

  <title>Public Storage</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="container">

    <!-- Header -->

    <header class="header">

      <div>
        <h1>📦 Public Storage</h1>

        <p>
          Upload photos and videos
          to shared storage.
        </p>
      </div>

    </header>


    <!-- Storage Card -->

    <section class="storage-card">

      <div class="storage-top">

        <div>
          <span class="label">
            STORAGE
          </span>

          <h2 id="storageText">
            Loading...
          </h2>
        </div>

        <div class="storage-icon">
          💾
        </div>

      </div>


      <div class="progress">

        <div
          id="storageProgress"
          class="progress-bar"
        ></div>

      </div>


      <div class="storage-details">

        <span id="usedText">
          Used: -
        </span>

        <span id="freeText">
          Free: -
        </span>

      </div>


      <div class="file-count">

        <span>
          Files:
        </span>

        <strong id="fileCount">
          0
        </strong>

      </div>

    </section>


    <!-- Upload Card -->

    <section class="upload-card">

      <h2>
        Upload Photos & Videos
      </h2>

      <p class="description">
        Anyone with access to this website
        can upload media.
      </p>


      <label
        class="file-picker"
        for="fileInput"
      >

        <div class="upload-icon">
          ⬆️
        </div>

        <strong>
          Select Photos / Videos
        </strong>

        <small>
          JPG, PNG, WEBP, GIF, MP4, WEBM,
          MOV, MKV
        </small>

        <small>
          No application file-size limit
        </small>

      </label>


      <input
        id="fileInput"
        type="file"
        accept="image/*,video/*"
        multiple
        hidden
      >


      <!-- Selected files -->

      <div
        id="selectedFiles"
        class="selected-files"
      ></div>


      <button
        id="uploadBtn"
        class="upload-btn"
        disabled
      >
        Upload
      </button>


      <!-- Upload progress -->

      <div
        id="uploadProgressContainer"
        class="upload-progress-container"
        hidden
      >

        <div
          class="upload-progress"
        >

          <div
            id="uploadProgressBar"
            class="upload-progress-bar"
          ></div>

        </div>

        <p id="uploadProgressText">
          Uploading...
        </p>

      </div>


      <p
        id="message"
        class="message"
      ></p>

    </section>


    <!-- Gallery -->

    <section class="gallery-section">

      <div class="gallery-header">

        <div>

          <h2>
            Shared Gallery
          </h2>

          <p>
            Photos and videos uploaded
            by everyone.
          </p>

        </div>


        <button
          id="refreshBtn"
          class="refresh-btn"
        >
          🔄
        </button>

      </div>


      <div
        id="gallery"
        class="gallery"
      >

        <div class="loading">
          Loading gallery...
        </div>

      </div>

    </section>

  </div>


  <!-- Lightbox -->

  <div
    id="lightbox"
    class="lightbox"
    hidden
  >

    <button
      id="closeLightbox"
      class="close-lightbox"
    >
      ✕
    </button>

    <div
      id="lightboxContent"
      class="lightbox-content"
    ></div>

  </div>


  <script src="app.js"></script>

</body>

</html>
